name: PR status semanal

on:
  schedule:
    # lunes 15:00 UTC = 9:00 am Mexico (UTC-6). GitHub puede retrasarlo unos minutos.
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerar estado de PRs en el README
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: Jorge-Polanco-Roque
        run: bash tools/update_pr_status.sh
      - name: Commitear si hubo cambios
        run: |
          if git diff --quiet -- README.md; then
            echo "Sin cambios en el estado de PRs."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: actualización semanal del estado de PRs"
            git push
          fi
